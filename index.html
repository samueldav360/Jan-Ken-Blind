<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jan-Ken-Blind</title>
    <style>
        body {
            margin: 0;
            background: #141419;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            background: #0d0d11;
            border: 3px solid #ff0055;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.3);
            cursor: pointer;
            max-width: 95vw;
            max-height: 95vh;
        }
    </style>
</head>
<body>

    <canvas id="canvasJuego" width="800" height="600"></canvas>

    <script src="variables.js"></script>
    <script src="logica.js"></script>
    <script src="ruleta.js"></script>

    <script>
        canvas.addEventListener("mousedown", (evento) => {
            const rect = canvas.getBoundingClientRect();
            const clicX = evento.clientX - rect.left;
            const clicY = evento.clientY - rect.top;

            if (estadoActual === 'MENU') {
                if (verificarClicRec(clicX, clicY, botonInicio)) {
                    iniciarNuevaPartida();
                    estadoActual = 'JUEGO';
                }
            } 
            else if (estadoActual === 'JUEGO') {
                if (verificarClicRec(clicX, clicY, botonesOpciones['derecha'])) {
                    valor = (valor % 3) + 1;
                } else if (verificarClicRec(clicX, clicY, botonesOpciones['izquierda'])) {
                    valor = (valor === 1) ? 3 : valor - 1;
                }
                if (verificarClicRec(clicX, clicY, botonAcciones)) {
                    ejecutarTurnoPvE(opciones[valor - 1]);
                }
            }
            else if (estadoActual === 'VICTORIA' || estadoActual === 'DERROTA') {
                if (verificarClicRec(clicX, clicY, botonReiniciar)) {
                    estadoActual = 'MENU';
                }
            }
        });

        function dibujar() {
            // Pausar el dibujado de este bucle si la ruleta está girando
            if (estadoActual === 'RULETA') return; 

            ctx.fillStyle = "#0d0d11";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = "center";

            if (estadoActual === 'MENU') {
                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 45px monospace";
                ctx.fillText("OPERACIÓN: PVE JAX", 400, 200);

                ctx.font = "18px monospace";
                ctx.fillStyle = "#666";
                ctx.fillText("Derrota al sistema para sobrevivir.", 400, 250);

                ctx.fillStyle = "#ff0055";
                ctx.fillRect(botonInicio.x, botonInicio.y, botonInicio.ancho, botonInicio.alto);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 20px monospace";
                ctx.fillText("INICIAR", 400, 412);
            } 
            else if (estadoActual === 'JUEGO') {
                // 1. Salud y títulos
                ctx.fillStyle = "#00ffcc";
                ctx.font = "bold 22px monospace";
                ctx.fillText(`TU SALUD: ${jugador.hp}`, 250, 60);
                
                ctx.fillStyle = "#ff3333";
                ctx.font = "bold 22px monospace";
                ctx.fillText(`RIVAL HP: ${vidaRival}`, 550, 60); 

                ctx.fillStyle = "#888";
                ctx.font = "18px monospace";
                ctx.fillText("Tu acción:", 250, 120);
                ctx.fillText("Acción enemiga:", 550, 120);

                // 2. Tu Carrusel
                const imagenSeleccionada = imagenesCarrusel[valor - 1];
                if (imagenSeleccionada) {
                    ctx.drawImage(imagenSeleccionada, 170, 150, 160, 160); 
                }
                
                ctx.fillStyle = "#fff";
                ctx.font = "bold 24px monospace";
                ctx.fillText(opciones[valor - 1], 250, 340);

                // 3. Imagen del Rival
                if (eleccionRival) {
                    const indiceRival = opciones.indexOf(eleccionRival);
                    const imagenRival = imagenesCarrusel[indiceRival];
                    if (imagenRival) {
                        ctx.drawImage(imagenRival, 470, 150, 160, 160); 
                    }
                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 24px monospace";
                    ctx.fillText(eleccionRival, 550, 340);
                } else {
                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 28px monospace";
                    ctx.fillText("???", 550, 230);
                }

                // 4. Flechas
                ctx.save();
                ctx.translate(botonesOpciones['izquierda'].x + 40, botonesOpciones['izquierda'].y + 40);
                ctx.rotate(Math.PI / 2); 
                ctx.drawImage(imgFlecha, -40, -40, 80, 80);
                ctx.restore();

                ctx.save();
                ctx.translate(botonesOpciones['derecha'].x + 40, botonesOpciones['derecha'].y + 40);
                ctx.rotate(-Math.PI / 2); 
                ctx.drawImage(imgFlecha, -40, -40, 80, 80);
                ctx.restore();

                // 5. Textos Inferiores
                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 20px monospace";
                ctx.fillText(registroResultado, 400, 420);
                
                ctx.font = "14px monospace";
                ctx.fillStyle = "#666";
                ctx.fillText(`Ronda: ${ronda} | Ganadas: ${rondasGanadas}`, 400, 460);

                // 6. Botón ELEGIR
                ctx.fillStyle = "#ff0055";
                ctx.fillRect(botonAcciones.x, botonAcciones.y, botonAcciones.ancho, botonAcciones.alto);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 20px monospace";
                ctx.fillText("ELEGIR", 400, botonAcciones.y + 32);
            }
            else if (estadoActual === 'VICTORIA' || estadoActual === 'DERROTA') {
                ctx.fillStyle = estadoActual === 'VICTORIA' ? "#00ffcc" : "#ff3333";
                ctx.font = "bold 45px monospace";
                ctx.fillText(estadoActual === 'VICTORIA' ? "¡VICTORIA!" : "¡DERROTA!", 400, 200);

                ctx.fillStyle = "#fff";
                ctx.font = "18px monospace";
                ctx.fillText(`Sobreviviste ${ronda} rondas y ganaste ${rondasGanadas}.`, 400, 260);

                ctx.fillStyle = "#ff0055";
                ctx.fillRect(botonReiniciar.x, botonReiniciar.y, botonReiniciar.ancho, botonReiniciar.alto);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 20px monospace";
                ctx.fillText("MENÚ", 400, 452);
            }

            requestAnimationFrame(dibujar);
        }

        dibujar();
    </script>
</body>
</html>
