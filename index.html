<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jan-Ken-Blind</title>
    <style>
        body {
            margin: 0;
            background: #141419;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            background: #0d0d11;
            border: 3px solid #ff0055;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="canvasJuego" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById("canvasJuego");
        const ctx = canvas.getContext("2d");

        // ESTADOS: 'MENU', 'JUEGO', 'VICTORIA', 'DERROTA'
        let estadoActual = 'MENU';

        // --- VARIABLES PVE ---
        let vidaJugador = 150;
        let vidaRival = 500;
        let rondasGanadas = 0;
        let ronda = 0;

        let eleccionJugador = '';
        let eleccionRival = '';
        let indiceUltimo = '';
        let registroResultado = '¡Prepárate para combatir!';
        const opciones = ['Piedra', 'Papel', 'Tijera'];

        // Definición de Botones de Control
        const botonInicio = { x: 300, y: 380, ancho: 200, alto: 50 };
        const botonReiniciar = { x: 300, y: 420, ancho: 200, alto: 50 };
        
        const botonesOpciones = {
            'Piedra': { x: 150, y: 460, ancho: 120, alto: 60 },
            'Papel':  { x: 340, y: 460, ancho: 120, alto: 60 },
            'Tijera': { x: 530, y: 460, ancho: 120, alto: 60 }
        };

        function verificarClicRec(x, y, boton) {
            return x >= boton.x && x <= boton.x + boton.ancho &&
                   y >= boton.y && y <= boton.y + boton.alto;
        }

        // --- CONTROL DE CLICS ---
        canvas.addEventListener("mousedown", (evento) => {
            const rect = canvas.getBoundingClientRect();
            const clicX = evento.clientX - rect.left;
            const clicY = evento.clientY - rect.top;

            if (estadoActual === 'MENU') {
                if (verificarClicRec(clicX, clicY, botonInicio)) {
                    iniciarNuevaPartida();
                    estadoActual = 'JUEGO';
                }
            } 
            else if (estadoActual === 'JUEGO') {
                const indiceRival = Math.floor(Math.random() * 4);
                
                for (let opcion of opciones) {
                    if (verificarClicRec(clicX, clicY, botonesOpciones[opcion])) {
                        ejecutarTurnoPvE(opcion);
                        break;
                    }
                }
            }
            else if (estadoActual === 'VICTORIA' || estadoActual === 'DERROTA') {
                if (verificarClicRec(clicX, clicY, botonReiniciar)) {
                    estadoActual = 'MENU';
                }
            }
        });

        function Maxvalue(array) {
            const counts = {};
            let maxCount = 0;
            let mostFrequent = null;

            for (const item of array) {
                counts[item] = (counts[item] || 0) + 1;
                if (counts[item] > maxCount) {
                    maxCount = counts[item];
                    mostFrequent = item;
                }
            }

            return mostFrequent;
        }
        const HistorialJugador = [];


        function ejecutarTurnoPvE(eleccionUsuario) {
            eleccionJugador = eleccionUsuario;
            HistorialJugador.push(eleccionJugador);

            function indiceBrorracho() {
                const indice = Math.floor(Math.random() * opciones.length);
                return opciones[indice];
            }

            function indiceIdiota() {
                const azar = Math.random() * 100;
                if (azar < 60) return 'Piedra';
                else if (azar < 80) return 'Papel';
                else return 'Tijera';
            }

            function indiceElectrico() {
                const azar = Math.random() * 100;
                let NewsOptions = opciones.filter((v) => v !== opciones[indiceUltimo]);
                if (azar < 45) return NewsOptions[0];
                else if (azar < 90) return NewsOptions[1];
                else return opciones[indiceUltimo];
            }

            function indiceCasador() {
                const tendenciaJugador = Maxvalue(HistorialJugador);
                if (tendenciaJugador === 'Piedra') return 'Papel';
                else if (tendenciaJugador === 'Papel') return 'Tijera';
                else return 'Piedra';
            }

            if (indiceRival < 1) {
                eleccionRival = indiceBrorracho();
            } else if (indiceRival < 2) {
                eleccionRival = indiceIdiota();
            } else if (indiceRival < 3) {
                eleccionRival = indiceElectrico();
            } else {
                eleccionRival = indiceCasador();
            }

            indiceUltimo = opciones.indexOf(eleccionRival);



            if (eleccionJugador === eleccionRival) {
                registroResultado = "¡Choque de fuerzas! Empate";
            } 
            else if (
                (eleccionJugador === 'Piedra' && eleccionRival === 'Tijera') ||
                (eleccionJugador === 'Papel' && eleccionRival === 'Piedra') ||
                (eleccionJugador === 'Tijera' && eleccionRival === 'Papel')
            ) {
                vidaRival--;
                rondasGanadas++;
                registroResultado = "¡Golpeaste al rival!";
            } 
            else {
                vidaJugador--;
                registroResultado = "¡El rival te ha dañado!";
            }

            // Verificar Estados de Fin de Partida
            if (vidaRival <= 0) {
                estadoActual = 'VICTORIA';
            } else if (vidaJugador <= 0) {
                estadoActual = 'DERROTA';
            }
        }

        function iniciarNuevaPartida() {
            vidaJugador = 3;
            vidaRival = 3;
            rondasGanadas = 0;
            eleccionJugador = '';
            eleccionRival = '';
            registroResultado = '¡Elige tu ataque!';
        }

        // --- SISTEMA DE RENDERIZADO ---
        function dibujar() {
            ctx.fillStyle = "#0d0d11";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = "center";

            if (estadoActual === 'MENU') {
                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 45px monospace";
                ctx.fillText("OPERACIÓN: PVE JAX", 400, 200);

                ctx.font = "18px monospace";
                ctx.fillStyle = "#666";
                ctx.fillText("Derrota al sistema para sobrevivir.", 400, 250);

                // Botón Iniciar
                ctx.fillStyle = "#ff0055";
                ctx.fillRect(botonInicio.x, botonInicio.y, botonInicio.ancho, botonInicio.alto);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 20px monospace";
                ctx.fillText("INICIAR", 400, 412);
            } 
            else if (estadoActual === 'JUEGO') {
                // Interfaz de Vidas (HUD)
                ctx.font = "bold 22px monospace";
                ctx.fillStyle = "#00ffcc";
                ctx.fillText(`TU SALUD: ${"❤️".repeat(vidaJugador)}`, 200, 60);
                
                ctx.fillStyle = "#ff3333";
                ctx.fillText(`RIVAL HP: ${"❤️".repeat(vidaRival)}`, 600, 60); 

                // Pantalla de elecciones
                ctx.fillStyle = "#888";
                ctx.font = "18px monospace";
                ctx.fillText("Tu acción:", 250, 160);
                ctx.fillText("Acción enemiga:", 550, 160);

                ctx.fillStyle = "#fff";
                ctx.font = "bold 28px monospace";
                ctx.fillText(eleccionJugador || "esperando...", 250, 210);
                ctx.fillText(eleccionRival || "esperando...", 550, 210);

                // Consola de Combate central
                ctx.fillStyle = "#ffaa00";
                ctx.font = "bold 24px monospace";
                ctx.fillText(registroResultado, 400, 340);

                // Botones de Ataque
                for (let opcion of opciones) {
                    const btn = botonesOpciones[opcion];
                    ctx.strokeStyle = "#ff0055";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(btn.x, btn.y, btn.ancho, btn.alto);
                    
                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 18px monospace";
                    ctx.fillText(opcion, btn.x + btn.ancho / 2, btn.y + 36);
                }
            } 
            else if (estadoActual === 'VICTORIA' || estadoActual === 'DERROTA') {
                ctx.fillStyle = estadoActual === 'VICTORIA' ? "#00ffcc" : "#ff3333";
                ctx.font = "bold 50px monospace";
                ctx.fillText(estadoActual === 'VICTORIA' ? "SISTEMA DESTRUIDO" : "CONEXIÓN PERDIDA", 400, 230);

                ctx.fillStyle = "#fff";
                ctx.font = "20px monospace";
                ctx.fillText(`Rondas ganadas: ${rondasGanadas}`, 400, 300);

                // Botón Salir al Menú
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(botonReiniciar.x, botonReiniciar.y, botonReiniciar.ancho, botonReiniciar.alto);
                ctx.fillStyle = "#0d0d11";
                ctx.font = "bold 18px monospace";
                ctx.fillText("VOLVER AL MENÚ", 400, 452);
            }

            requestAnimationFrame(dibujar);
        }

        dibujar();
    </script>
</body>
</html>
