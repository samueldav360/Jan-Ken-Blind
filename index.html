<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jan-Ken-Blind</title>
    <style>
        body {
            margin: 0;
            background: #141419;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            background: #0d0d11;
            border: 3px solid #ff0055;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="canvasJuego" width="800" height="600"></canvas>

    <!-- CONEXIÓN CON TUS MÓDULOS EXTERNOS -->
    <script src="variables.js"></script>
    <script src="logica.js"></script>

    <!-- CONTROLADOR DEL CANVAS -->
    <script>
        // Escuchador de clics en el Canvas
        canvas.addEventListener("mousedown", (evento) => {
            const rect = canvas.getBoundingClientRect();
            const clicX = evento.clientX - rect.left;
            const clicY = evento.clientY - rect.top;

            if (estadoActual === 'MENU') {
                if (verificarClicRec(clicX, clicY, botonInicio)) {
                    iniciarNuevaPartida();
                    estadoActual = 'JUEGO';
                }
            } 
            else if (estadoActual === 'JUEGO') {
                for (let opcion of opciones) {
                    if (verificarClicRec(clicX, clicY, botonesOpciones[opcion])) {
                        if (vidaRival > 0 && vidaJugador > 0) {
                            ronda++;
                            ejecutarTurnoPvE(opcion);
                        }
                        break;
                    }
                }
            }
            else if (estadoActual === 'VICTORIA' || estadoActual === 'DERROTA') {
                if (verificarClicRec(clicX, clicY, botonReiniciar)) {
                    estadoActual = 'MENU';
                }
            }
        });

        // Tu función dibujar completa y exacta
        function dibujar() {
            ctx.fillStyle = "#0d0d11";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = "center";

            if (estadoActual === 'MENU') {
                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 45px monospace";
                ctx.fillText("OPERACIÓN: PVE JAX", 400, 200);

                ctx.font = "18px monospace";
                ctx.fillStyle = "#666";
                ctx.fillText("Derrota al sistema para sobrevivir.", 400, 250);

                ctx.fillStyle = "#ff0055";
                ctx.fillRect(botonInicio.x, botonInicio.y, botonInicio.ancho, botonInicio.alto);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 20px monospace";
                ctx.fillText("INICIAR", 400, 412);
            } 
            else if (estadoActual === 'JUEGO') {
                ctx.font = "bold 22px monospace";
                ctx.fillStyle = "#00ffcc";
                ctx.fillText(`TU SALUD: ${vidaJugador}`, 200, 60);
                
                ctx.fillStyle = "#ff3333";
                ctx.fillText(`RIVAL HP: ${vidaRival}`, 600, 60); 

                ctx.fillStyle = "#888";
                ctx.font = "18px monospace";
                ctx.fillText("Tu acción:", 250, 160);
                ctx.fillText("Acción enemiga:", 550, 160);

                ctx.fillStyle = "#fff";
                ctx.font = "bold 28px monospace";
                ctx.fillText(eleccionJugador || "---", 250, 210);
                ctx.fillText(eleccionRival || "---", 550, 210);

                ctx.fillStyle = "#ff0055";
                ctx.font = "bold 20px monospace";
                ctx.fillText(registroResultado, 400, 320);

                ctx.font = "14px monospace";
                ctx.fillStyle = "#666";
                ctx.fillText(`Ronda: ${ronda} | Ganadas: ${rondasGanadas}`, 400, 360);

                for (let opcion of opciones) {
                    const btn = botonesOpciones[opcion];
                    ctx.fillStyle = "#22222b";
                    ctx.strokeStyle = "#ff0055";
                    ctx.lineWidth = 2;
                    ctx.fillRect(btn.x, btn.y, btn.ancho, btn.alto);
                    ctx.strokeRect(btn.x, btn.y, btn.ancho, btn.alto);

                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 16px monospace";
                    ctx.fillText(opcion, btn.x + btn.ancho / 2, btn.y + btn.alto / 2 + 6);
                }
            }
            else if (estadoActual === 'VICTORIA' || estadoActual === 'DERROTA') {
                ctx.fillStyle = estadoActual === 'VICTORIA' ? "#00ffcc" : "#ff3333";
                ctx.font = "bold 45px monospace";
                ctx.fillText(estadoActual === 'VICTORIA' ? "¡VICTORIA!" : "¡DERROTA!", 400, 200);

                ctx.fillStyle = "#fff";
                ctx.font = "18px monospace";
                ctx.fillText(`Sobreviviste ${ronda} rondas y ganaste ${rondasGanadas}.`, 400, 260);

                ctx.fillStyle = "#ff0055";
                ctx.fillRect(botonReiniciar.x, botonReiniciar.y, botonReiniciar.ancho, botonReiniciar.alto);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 20px monospace";
                ctx.fillText("MENÚ", 400, 452);
            }

            requestAnimationFrame(dibujar);
        }

        // Arrancar el bucle gráfico por primera vez
        dibujar();
    </script>
</body>
</html>
